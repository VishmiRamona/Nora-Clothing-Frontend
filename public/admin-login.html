<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 300px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input { width: 100%; padding: 8px; margin: 8px 0; }
        button { width: 100%; padding: 8px; background: #11641B; color: white; border: none; cursor: pointer; }
        .error { color: red; }
    </style>
</head>
<body>
<div class="container">
    <h2>Admin Login</h2>
    <div id="error" class="error"></div>
    <input type="email" id="email" placeholder="Email" value="admin@noraclothing.com">
    <input type="password" id="password" placeholder="Password" value="admin123">
    <button onclick="login()">Login</button>
</div>
<script>
    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error');
        errorDiv.innerText = 'Logging in...';
        try {
            const response = await fetch('http://localhost:5000/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await response.json();
            if (response.ok) {
                // Store token and redirect
                localStorage.setItem('adminToken', data.token);
                window.location.href = '/admin/dashboard';
            } else {
                errorDiv.innerText = data.message || 'Login failed';
            }
        } catch (err) {
            errorDiv.innerText = 'Network error: ' + err.message;
        }
    }
</script>
</body>
</html>
